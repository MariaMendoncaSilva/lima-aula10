
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Trips</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            padding: 0 4%;
        }

        h1 {
            font-size: 40px;
            font-weight: normal;
            margin-bottom: 5px;
        }

        .site {
            width: 95%;
            margin: 0 auto;
        }

        header {
            height: 35px;
            background-color: #b39ddb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #4a235a;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #4a235a;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e91e63;
        }

        .banner {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .destinos {
            background-color: #f7f1fa;
            padding: 18px 10px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .card {
            width: 145px;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px #00000020;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 8px 4px 10px;
        }

        .card-info h3 {
            font-size: 13px;
            margin-bottom: 5px;
        }

        .card-info p {
            font-size: 11px;
            color: #777;
        }

        footer {
            background-color: #b39ddb;
            color: #4a235a;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            body {
                padding: 0 2%;
            }

            .site {
                width: 100%;
            }

            header {
                height: auto;
                min-height: 45px;
                flex-wrap: wrap;
                gap: 10px;
                padding: 10px;
            }

            nav {
                gap: 12px;com
            }

            .banner {
                height: 220px;
            }

            .card {
                width: 45%;
            }

            .card img {
                height: 120px;
            }
        }
    </style>
</head>
