
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 4%;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin: 0 0 25px 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header {
            background-color: #c2185b;
            color: white;
            height: 47px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            display: flex;
            gap: 8px;
            height: 392px;
            padding: 0 8px;
        }

        .menu-lateral {
            background-color: #f48fb1;
            width: 25%;
            padding: 2px;
        }

        .conteudo-principal {
            background-color: #b39ddb;
            flex: 1;
            padding: 2px;
        }

        .lateral-direita {
            background-color: #f48fb1;
            width: 25%;
            padding: 2px;
        }

        footer {
            background-color: #c2185b;
            color: white;
            height: 47px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <h1>Atividade html 🤷‍♀️🤷❤️</h1>

    <div class="container">

        <header>
        cabeçario 
        </header>

        <main>
            <aside class="menu-lateral">
              lateral esquerda
            </aside>

            <section class="conteudo-principal">
              meioo
            </section>

            <aside class="lateral-direita">
               lateral direita
            </aside>
        </main>

        <footer>
            maju
        </footer>

    </div>

</body>
</html>
